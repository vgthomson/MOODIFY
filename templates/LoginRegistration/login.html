<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Authentication System</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6C5CE7;      /* Soft Purple */
            --secondary-color: #00CECE;    /* Bright Teal */
            --accent-color: #FD71AF;       /* Hot Pink */
            --dark-bg: #12152e;            /* Deep Space Blue */
            --card-bg: rgba(30, 39, 82, 0.7);  /* Translucent Navy */
            --text-light: #ffffff;         /* Pure White */
            --text-muted: #a0aec0;         /* Soft Gray */
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.2) 0%, transparent 20%),
                radial-gradient(circle at 90% 50%, rgba(0, 206, 206, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 40% 80%, rgba(253, 113, 175, 0.1) 0%, transparent 30%);
            color: var(--text-light);
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 2.5rem 3rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow),
                        0 0 0 1px rgba(255, 255, 255, 0.1),
                        0 0 30px rgba(108, 92, 231, 0.2),
                        0 0 60px rgba(0, 206, 206, 0.1);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg, 
                transparent, 
                rgba(108, 92, 231, 0.1), 
                transparent
            );
            transform: rotate(45deg);
            animation: shimmer 6s linear infinite;
            z-index: -1;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 700;
            font-size: 2.5rem;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color) 50%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .input-group {
            position: relative;
        }

        input {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.2rem 1.5rem;
            border-radius: 12px;
            color: var(--text-light);
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            width: 100%;
            transition: var(--transition);
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(0, 206, 206, 0.1);
            background: rgba(255, 255, 255, 0.1);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        button {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: var(--text-light);
            padding: 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Quicksand', sans-serif;
            margin: 0.5rem 0;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, var(--secondary-color), var(--accent-color));
            z-index: -1;
            opacity: 0;
            transition: var(--transition);
        }

        button:hover::before {
            opacity: 1;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .message {
            text-align: center;
            color: var(--accent-color);
            margin: 1rem 0;
            min-height: 1.5rem;
            font-weight: 500;
        }

        a {
            color: var(--text-light);
            text-decoration: none;
            display: block;
            width: 100%;
            font-weight: 500;
            transition: var(--transition);
        }

        a:hover {
            color: var(--accent-color);
        }

        .alt-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 0.5rem;
        }

        .alt-button:hover::before {
            opacity: 0;
        }

        .alt-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 480px) {
            .container {
                margin: 1rem;
                padding: 2rem;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <p class="message">{% for message in messages %}{{ message }}{% endfor %}</p>
        <button class="alt-button"><a href="{% url 'forgot-password' %}">Forgot Password?</a></button>
        <button class="alt-button"><a href="{% url 'register' %}">Create New Account</a></button>
    </div>
</body>
</html>
