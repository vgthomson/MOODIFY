<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Authentication System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;      /* Vibrant Blue */
            --secondary-color: #2ecc71;    /* Emerald Green */
            --accent-color: #8e44ad;       /* Deep Purple */
            --dark-bg: #1a2238;            /* Deep Navy Blue */
            --darker-bg: #121725;          /* Darker Navy */
            --text-light: #ffffff;         /* Pure White */
            --text-muted: #a0aec0;         /* Soft Gray */
            --input-bg: #2c3e50;           /* Dark Slate */
            --input-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s ease;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), var(--dark-bg));
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 1rem;
            border-radius: 50px;
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.2);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        button {
            background: var(--primary-color);
            border: none;
            color: var(--text-light);
            padding: 1rem;
            border-radius: 50px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
            margin: 0.5rem 0;
        }

        button:hover {
            background: var(--secondary-color);
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(29, 185, 84, 0.3);
        }

        .message {
            text-align: center;
            color: var(--text-muted);
            margin: 1rem 0;
            min-height: 1.5rem;
        }

        @media (max-width: 480px) {
            .container {
                margin: 1rem;
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="reset-password" class="container">
        <h1>Reset Password</h1>
        <form action="{% url 'reset-password' reset_id=reset_id %}" method="POST">
            {% csrf_token %}
            <input type="password" name="password" placeholder="New Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
            <button type="submit">Reset Password</button>
        </form>
        <p class="message">{% for message in messages %}{{ message }}{% endfor %}</p>
    </div>
</body>
</html>
